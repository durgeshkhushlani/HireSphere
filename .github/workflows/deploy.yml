name: Deploy

# Runs only after CI (build+test+lint) succeeds on main — see ci.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    # apps/backend's postinstall (`prisma generate`) resolves DATABASE_URL
    # via prisma.config.ts at config-load time, even though generate itself
    # never connects — so it must be set job-wide, not just on the migrate
    # step, or `npm ci` fails before deploy ever gets there.
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Plan §8: migrations run against production as part of deploy, as a
      # one-off step here — not baked into the container's start command,
      # so multiple instances/restarts never race to migrate concurrently.
      - name: Run production migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
